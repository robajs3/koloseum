services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-koloseum_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-koloseum_pass}
      POSTGRES_DB: ${DB_NAME:-koloseum}
    volumes:
      - koloseum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-koloseum_user} -d ${DB_NAME:-koloseum}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    # Stała nazwa kontenera — inne appki (np. planowiec, przy imporcie
    # egzaminów) łączą się z koloseum po tej nazwie w sieci sso_net,
    # dokładnie tak jak łączą się z LoginHub po nazwie "hub-web".
    container_name: koloseum-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-zmien-mnie-na-losowy-dlugi-ciag-znakow}
      DATABASE_URL: postgresql://${DB_USER:-koloseum_user}:${DB_PASSWORD:-koloseum_pass}@db:5432/${DB_NAME:-koloseum}
      UPLOAD_FOLDER: /app/uploads
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Prefiks widziany przez przeglądarkę/Tailscale Serve — patrz
      # PrefixMiddleware w app.py. Domyślna wartość w config.py i tak jest
      # "/koloseum", to tylko pozwala nadpisać w razie potrzeby.
      PREFIX: ${PREFIX:-/koloseum}
      FILEVAULT_INTERNAL_URL: ${FILEVAULT_INTERNAL_URL:-http://host.docker.internal:8000}
      FILEVAULT_BASE_URL: ${FILEVAULT_BASE_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL:-}
      # SSO (LoginHub) — SSO_SECRET musi być DOKŁADNIE tą samą wartością co
      # w .env LoginHub. hub-web to nazwa kontenera LoginHub w sso_net.
      SSO_SECRET: ${SSO_SECRET:-}
      HUB_INTERNAL_URL: ${HUB_INTERNAL_URL:-http://hub-web:8000}
      # Podsumowania AI materiałów PDF — lokalna Ollama (kontener "ollama" niżej)
      AI_SUMMARY_ENABLED: ${AI_SUMMARY_ENABLED:-true}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      AI_SUMMARY_MODEL: ${AI_SUMMARY_MODEL:-gemma3:4b}
      AI_SUMMARY_MAX_CHARS: ${AI_SUMMARY_MAX_CHARS:-10000}
      AI_SUMMARY_NUM_CTX: ${AI_SUMMARY_NUM_CTX:-4096}
      AI_SUMMARY_MAX_TOKENS: ${AI_SUMMARY_MAX_TOKENS:-700}
      AI_SUMMARY_NUM_THREADS: ${AI_SUMMARY_NUM_THREADS:-0}
      AI_SUMMARY_TIMEOUT: ${AI_SUMMARY_TIMEOUT:-900}
      AI_SUMMARY_DAILY_LIMIT: ${AI_SUMMARY_DAILY_LIMIT:-30}
    ports:
      # Zmapowane na localhost — Tailscale Serve wskazuje na ten port,
      # tak jak wcześniej wskazywał na usługę systemd na 5001.
      - "${APP_PORT:-5001}:5000"
    volumes:
      - koloseum_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - sso_net

  # Lokalny serwer LLM do podsumowań PDF. Nie wystawiamy portu na hosta —
  # dostępny tylko dla kontenera "app" w sieci compose.
  ollama:
    image: ollama/ollama:latest
    container_name: koloseum-ollama
    restart: unless-stopped
    environment:
      # Tylko CPU: karta (GT710) nie jest używana — kontener nie dostaje GPU,
      # a CUDA_VISIBLE_DEVICES=-1 dodatkowo blokuje próby jej użycia.
      CUDA_VISIBLE_DEVICES: "-1"
      OLLAMA_NUM_PARALLEL: "1"        # jedno zapytanie naraz = pełna moc CPU dla niego
      OLLAMA_MAX_LOADED_MODELS: "1"   # nie trzymaj kilku modeli w RAM
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_FLASH_ATTENTION: "1"     # mniejsze zużycie RAM/CPU przy kontekście
    volumes:
      - koloseum_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Jednorazowo pobiera model (zapisuje się w wolumenie, kolejne starty są szybkie).
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${AI_SUMMARY_MODEL:-gemma3:4b}"]

volumes:
  koloseum_pgdata:
  koloseum_ollama:
  koloseum_uploads:

networks:
  default:
  sso_net:
    external: true
